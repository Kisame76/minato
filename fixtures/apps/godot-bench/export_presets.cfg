; Test 2's two APKs of one project (ADR-0042 decision 1): the Mobile renderer on Vulkan, and the Compatibility
; renderer on GLES 3.0 through the preset's command line, which beats the project's settings. Each names the
; driver it must draw with (bench.gd). Exported by tools/build-godot.sh without Gradle, arm64-v8a only, with our
; icons and the keystore that the script gives through Godot's environment variables. The iOS preset gives only the
; twin's pack, Minato.pck (tools/build-godot.sh --pack): the twin brings its own engine (ADR-0042 decision 3), and the
; driver comes from the twin's command line.

[preset.0]

name="Android Vulkan"
platform="Android"
runnable=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="1.0"
package/unique_name="io.github.kisame76.minato.godotbench.vulkan"
package/name="godot-bench-vulkan"
package/signed=true
launcher_icons/main_192x192="res://icons/icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://icons/foreground_432.png"
launcher_icons/adaptive_background_432x432="res://icons/background_432.png"
launcher_icons/adaptive_monochrome_432x432="res://icons/monochrome_432.png"
command_line/extra_args="-- --bench-driver=vulkan"

