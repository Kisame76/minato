# XcodeGen spec. Generate the Xcode project with `xcodegen generate`.
# APKRunner.xcodeproj, app/Info.plist and app/APKRunner.entitlements are generated and not versioned.
name: APKRunner

options:
  bundleIdPrefix: io.github.kisame76
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Personal Team ID; tools/deploy.sh passes it in, empty is fine for the Simulator.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

packages:
  APKKit:
    path: importer/APKKit

targets:
  APKRunner:
    type: application
    platform: iOS
    sources:
      - path: app/Sources
      # Feasibility spikes S1–S3 and S1b (docs/STATUS.md), run by Debug builds launched with -runSpikes.
      - path: app/Spikes
        excludes:
          - "TestLibrary/**"
    dependencies:
      - package: APKKit
        product: APKKit
      - package: APKKit
        product: APKLibrary
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: APK-Runner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Required for apps built with the iOS 27 SDK.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # No UIFileSharingEnabled: the app has no folder in the Files app (ADR-0018).
        # "Open with" hands over the original file instead of a copy in Documents/Inbox.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Android Package
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.android.package-archive
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.android.package-archive
            UTTypeDescription: Android Package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - apk
              public.mime-type:
                - application/vnd.android.package-archive
    # Every build carries increased-memory-limit: about 6 GiB instead of 3.3 GiB
    # and a 64 GiB address range on iOS 27 (ADR-0012, spike S2).
    entitlements:
      path: app/APKRunner.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kisame76.apkrunner
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: app/Spikes/Spikes-Bridging-Header.h
    postBuildScripts:
      - name: Build spike test dylibs
        script: exec "$SRCROOT/tools/build-spike-dylibs.sh"
        inputFiles:
          - $(SRCROOT)/app/Spikes/TestLibrary/spike_s1.c
          - $(SRCROOT)/tools/build-spike-dylibs.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Spikes/SpikeS1.dylib
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Spikes/SpikeS1-adhoc.dylib
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Spikes/SpikeS1-bundleid.dylib
    scheme: {}
