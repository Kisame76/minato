# XcodeGen spec. Generate the Xcode project with `xcodegen generate`.
# Minato.xcodeproj, app/Info.plist and app/Minato.entitlements are generated and not versioned.
# Before building in Xcode, run tools/build-native.sh --app once: the app links build/APKRuntime.xcframework.
# It also links build/MinatoGraphics.xcframework from tools/build-graphics-host.sh.
name: Minato

options:
  bundleIdPrefix: io.github.kisame76
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # A beta's label beside the version, "Beta 1" for v1.0.0-beta.1, which tools/release.sh sets (docs/RELEASING.md);
    # empty for a final version and for builds between releases.
    MINATO_RELEASE_LABEL: ""
    # Personal Team ID; tools/deploy.sh passes it in, empty is fine for the Simulator.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

packages:
  APKKit:
    path: importer/APKKit

targets:
  Minato:
    type: application
    platform: iOS
    sources:
      - path: app/Sources
      # Asset catalog with the app icon (ADR-0024).
      - path: app/Resources
      # Feasibility spikes S1–S3 and S1b, run by Debug builds launched with -runSpikes.
      - path: app/Spikes
        excludes:
          - "TestLibrary/**"
      # The fixture tests on the iPhone (M2 step 6), run by Debug builds launched with -runFixture <test>.
      - path: app/Fixtures
      # The parity benchmark's mode (ADR-0037), compiled only with APK_EMBED_BENCHMARK=YES.
      - path: app/Benchmark
    dependencies:
      - package: APKKit
        product: APKKit
      - package: APKKit
        product: APKLibrary
      # What the app decides about its signing certificate (ADR-0023).
      - package: APKKit
        product: APKSigning
      # Game mode's launch request, launch decision and lifecycle (ADR-0032).
      - package: APKKit
        product: APKSession
      # The parity benchmark's run plan, CSV and validity (ADR-0037).
      - package: APKKit
        product: APKBench
      # Runtime (runtime/, C++). tools/build-native.sh --app builds it; sim.sh and deploy.sh call it first.
      - framework: build/APKRuntime.xcframework
        embed: false
      # Converter and signer (importer/converter/, C++): ELF to signed container on the iPhone (ADR-0022).
      - framework: build/APKConvert.xcframework
        embed: false
      # The host side of the graphics (graphics/host, ADR-0030). tools/build-graphics-host.sh builds it.
      - framework: build/MinatoGraphics.xcframework
        embed: false
      # MoltenVK (ADR-0030): embedded and signed in device builds, not linked; graphics/host opens it with
      # dlopen. The framework itself, since Xcode wants a Simulator slice of every xcframework it embeds.
      - framework: build/MoltenVK.xcframework/ios-arm64/MoltenVK.framework
        embed: true
        link: false
      # ANGLE's libGLESv2 (ADR-0029, decision 6): embedded and signed in device and Simulator builds, not
      # linked; graphics/host opens it with dlopen when the loader first loads a GLES front lib.
      # tools/build-angle.sh builds it, stripped.
      - framework: build/ANGLE.xcframework
        embed: true
        link: false
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: Minato
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MinatoReleaseLabel: $(MINATO_RELEASE_LABEL)
        LSRequiresIPhoneOS: true
        # The display link may run at 120 Hz on ProMotion iPhones (ADR-0036, decision 2).
        CADisableMinimumFrameDurationOnPhone: true
        # Required for apps built with the iOS 27 SDK.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The certificate export of SideStore and AltStore answers here (ADR-0023).
        CFBundleURLTypes:
          - CFBundleURLName: io.github.kisame76.minato.certificate
            CFBundleURLSchemes:
              - minato
        # To see whether the store that installed the app is still there (canOpenURL).
        LSApplicationQueriesSchemes:
          - sidestore
          - altstore-classic
        # iOS Game Mode in every build (ADR-0037, decision 9); our own texts still never say "game".
        LSSupportsGameMode: true
        # A mouse's or trackpad's clicks come as the pointer's, not as touches (ADR-0068 decision 5).
        UIApplicationSupportsIndirectInputEvents: true
        LSApplicationCategoryType: public.app-category.games
        # The commit a benchmark build was built from (ADR-0037, decision 5); tools/benchmark.sh sets it.
        MinatoCommit: $(MINATO_COMMIT)
        # What the apps the user runs save to Photos, with add-only access (ADR-0057 step e).
        NSPhotoLibraryAddUsageDescription: Lets apps you run in Minato save photos and videos to your library.
        # Apps that ask for the microphone (ADR-0064), location (ADR-0063) or the camera (ADR-0073), after Minato's own
        # question for that app.
        NSCameraUsageDescription: Lets apps you run in Minato use the camera, only when you allow it for that app.
        NSMicrophoneUsageDescription: Apps you run in Minato can use the microphone when they ask for it.
        NSLocationWhenInUseUsageDescription: >-
          Lets apps you run in Minato use your approximate or precise location, only when you allow it for that app.
        # No UIFileSharingEnabled: the app has no folder in the Files app (ADR-0018).
        # "Open with" hands over the original file instead of a copy in Documents/Inbox.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Android Package
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.android.package-archive
          # A set of APKs in one ZIP: bundletool's, SAI's or App Manager's (ADR-0049 a3). A plain .zip is taken by +
          # only, so "Open with" does not offer Minato for every ZIP (decision 8).
          - CFBundleTypeName: Android Package Set
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - io.github.kisame76.minato.apks
          # An app's APKs with its OBBs in one ZIP, APKPure's .xapk (ADR-0049 c2).
          - CFBundleTypeName: XAPK Package
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - io.github.kisame76.minato.xapk
          # An app's APKs in one ZIP with APKMirror's info.json, a plain .apkm (ADR-0049 e); an encrypted one is
          # refused with its reason.
          - CFBundleTypeName: APKM Package
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - io.github.kisame76.minato.apkm
          # An app's expansion file on its own (ADR-0049 d).
          - CFBundleTypeName: Android Expansion File
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - io.github.kisame76.minato.obb
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.android.package-archive
            UTTypeDescription: Android Package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - apk
              public.mime-type:
                - application/vnd.android.package-archive
          # Imported, not exported: .apks is Google's format, which Minato does not define.
          - UTTypeIdentifier: io.github.kisame76.minato.apks
            UTTypeDescription: Android Package Set
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - apks
          # Imported, not exported: .xapk is APKPure's format, which Minato does not define.
          - UTTypeIdentifier: io.github.kisame76.minato.xapk
            UTTypeDescription: XAPK Package
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - xapk
          # Imported, not exported: .apkm is APKMirror's format, which Minato does not define; public.data, as an
          # encrypted APKM is no ZIP.
          - UTTypeIdentifier: io.github.kisame76.minato.apkm
            UTTypeDescription: APKM Package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - apkm
          # Imported, not exported: .obb is Android's expansion file, which Minato does not define.
          - UTTypeIdentifier: io.github.kisame76.minato.obb
            UTTypeDescription: Android Expansion File
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - obb
    # Every build carries increased-memory-limit: about 6 GiB instead of 3.3 GiB
    # and a 64 GiB address range on iOS 27 (ADR-0012, spike S2).
    entitlements:
      path: app/Minato.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kisame76.minato
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: app/Sources/Minato-Bridging-Header.h
        # YES puts the fixture tests into Debug builds (tools/embed-fixtures.sh); tools/device-suite.sh sets it.
        APK_EMBED_FIXTURES: NO
        # YES makes a Release build the benchmark build (ADR-0037, decision 3): the mode, compiled under
        # BENCHMARK, and tools/embed-benchmark.sh's MinatoBench.framework and APKs. tools/benchmark.sh sets it.
        APK_EMBED_BENCHMARK: NO
        APK_BENCHMARK_CONDITION_YES: BENCHMARK
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(APK_BENCHMARK_CONDITION_$(APK_EMBED_BENCHMARK))
        MINATO_COMMIT: ""
        # tools/release.sh: the release page and the SHA-256 of the source archive that Licenses/*/SOURCE.txt name
        # (tools/bundle-licenses.py); empty in a build that is no release.
        MINATO_SOURCE_URL: ""
        MINATO_SOURCE_SHA256: ""
        # A public release carries no local build paths (tools/check-no-build-paths.sh): map the build root out
        # of the app's own code -- Swift #file/#filePath, C/ObjC/C++ __FILE__ and debug info. $(SRCROOT) is the
        # repo root at build time. The native libraries do the same in their CMake builds (tools/prefix-map-flags.sh).
        OTHER_CFLAGS: ["$(inherited)", "-ffile-prefix-map=$(SRCROOT)/="]
        OTHER_CPLUSPLUSFLAGS: ["$(inherited)", "-ffile-prefix-map=$(SRCROOT)/="]
        OTHER_SWIFT_FLAGS: ["$(inherited)", "-file-prefix-map", "$(SRCROOT)/="]
        # MoltenVK has no Simulator slice (ADR-0030, decision 8).
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphonesimulator*]": MoltenVK.framework
      configs:
        Debug:
          # graphics/host's probe (ADR-0030 V3), in Debug builds only: with MINATO_GRAPHICS_PROBE set,
          # it checks the embedded MoltenVK before main and ends the app.
          OTHER_LDFLAGS: ["$(inherited)", "-Wl,-u,_minato_graphics_probe"]
    postBuildScripts:
      - name: Build spike test dylibs
        script: exec "$SRCROOT/tools/build-spike-dylibs.sh"
        inputFiles:
          - $(SRCROOT)/app/Spikes/TestLibrary/spike_s1.c
          - $(SRCROOT)/tools/build-spike-dylibs.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Spikes/SpikeS1.dylib
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Spikes/SpikeS1-adhoc.dylib
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Spikes/SpikeS1-bundleid.dylib
      - name: Embed the guest system
        script: exec "$SRCROOT/tools/embed-guest-system.sh"
        basedOnDependencyAnalysis: false
      - name: Embed fixture containers
        script: exec "$SRCROOT/tools/embed-fixtures.sh"
        basedOnDependencyAnalysis: false
      - name: Embed the benchmark
        script: exec "$SRCROOT/tools/embed-benchmark.sh"
        basedOnDependencyAnalysis: false
      # The license texts of what the app embeds (THIRD_PARTY.md), after the frameworks are in the bundle.
      - name: Bundle license texts
        script: exec python3 "$SRCROOT/tools/bundle-licenses.py"
        basedOnDependencyAnalysis: false
    scheme: {}
